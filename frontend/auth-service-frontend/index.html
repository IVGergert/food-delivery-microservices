<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Delivery — Авторизация</title>
  <link rel="stylesheet" href="../common/css/base.css">
  <link rel="stylesheet" href="../common/css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">

      <div class="brand">
        <h1>Food Delivery</h1>
      </div>

      <div class="role-selector">
        <button id="btnCustomer" class="role-btn active">
          Я Клиент
        </button>

        <button id="btnCourier" class="role-btn">
          Я Курьер
        </button>

        <button id="btnAdmin" class="role-btn">
          Я Администратор
        </button>
      </div>

      <div class="tabs">
        <button id="loginTab" class="tab active">Вход</button>
        <button id="registerTab" class="tab">Регистрация</button>
      </div>

      <div id="alertBox" class="alert hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input id="loginEmail" placeholder="user@food.com">
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" placeholder="******">
        </div>

        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <form id="registerForm" class="hidden">

        <div class="form-group">
          <label>Email</label>
          <input id="regEmail" placeholder="customer@food.com">
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="regPassword" placeholder="******">
        </div>

        <div class="form-group">
          <label>Подтвердите пароль</label>
          <input type="password" id="regConfirmPassword" placeholder="******">
        </div>

        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </form>

      <div id="roleNotice" class="notice hidden"></div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
