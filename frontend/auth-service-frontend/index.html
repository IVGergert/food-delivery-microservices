<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Delivery — Авторизация</title>
  <link rel="stylesheet" href="../common/css/base.css">
  <link rel="stylesheet" href="../common/css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">

      <div class="brand">
        <h1>Food Delivery</h1>
      </div>

      <div class="role-selector">
        <button id="btnCustomer" class="role-btn active" onclick="selectRole('CUSTOMER')">
          Я Клиент
        </button>

        <button id="btnCourier" class="role-btn" onclick="selectRole('COURIER')">
          Я Курьер
        </button>

        <button id="btnAdmin" class="role-btn" onclick="selectRole('ADMIN')">
          Я Администратор
        </button>
      </div>

      <div class="tabs">
        <button id="loginTab" class="tab active" onclick="switchTab('login')">Вход</button>
        <button id="registerTab" class="tab" onclick="switchTab('register')">Регистрация</button>
      </div>

      <div id="alertBox" class="alert hidden"></div>

      <form id="loginForm" onsubmit="onLogin(event)" novalidate>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="user@food.com" required>
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" placeholder="******" required>
        </div>

        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <form id="registerForm" class="hidden" onsubmit="onRegister(event)" novalidate>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="customer@food.com" required>
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="regPassword" placeholder="******" required minlength="6" maxlength="16">
        </div>

        <div class="form-group">
          <label>Подтвердите пароль</label>
          <input type="password" id="regConfirmPassword" placeholder="******" required minlength="6" maxlength="16">
        </div>

        <button type="submit" class="btn btn-success">Зарегистрироваться</button>
      </form>

      <div id="roleNotice" class="notice hidden"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
