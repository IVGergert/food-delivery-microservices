<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Delivery - Панель администратора</title>

    <link rel="stylesheet" href="/admin/common/css/base.css">
    <link rel="stylesheet" href="/admin/common/css/components.css">
    <link rel="stylesheet" href="/admin/common/css/profile.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>

<body>

<aside class="sidebar">

    <div class="sidebar-header">
        <h1>Food Delivery</h1>
        <span>Администратор</span>
    </div>

    <nav class="sidebar-nav">

        <button type="button"
                class="nav-item active"
                data-section="users"
        >
            Пользователи
        </button>

        <button type="button"
                class="nav-item"
                data-section="profile">
            Профиль
        </button>

    </nav>

    <div class="sidebar-footer">
        <div id="userEmail"></div>

        <button type="button" id="logoutButton" class="logout-button">
            Выйти
        </button>
    </div>

</aside>

<main class="main-content">

    <header class="page-header">
        <div>
            <h2 id="pageTitle">Пользователи</h2>

            <p id="pageSubtitle">
                Управление пользователями системы
            </p>
        </div>
    </header>

    <div id="alertBox" class="alert hidden" role="alert"></div>

    <section id="usersSection" class="content-section">

        <div class="section-card">

            <div class="section-card-header">

                <div>
                    <h2>Пользователи</h2>

                    <p>Управление аккаунтами пользователей системы </p>
                </div>

                <div class="section-actions">

                    <button type="button"
                            id="refreshUsersButton"
                            class="secondary-button"> Обновить
                    </button>

                    <button type="button"
                            id="addCourierButton"
                            class="primary-button"> Добавить курьера
                    </button>

                    <button type="button"
                            id="addAdminButton"
                            class="primary-button"> Добавить администратора
                    </button>

                </div>

            </div>

            <div class="users-toolbar">

                <div class="form-group">
                    <label for="userSearchInput">
                        Поиск
                    </label>

                    <input type="search"
                           id="userSearchInput"
                           placeholder="ID, имя, фамилия, email, роль..."
                           autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="userRoleFilter">
                        Роль
                    </label>

                    <select id="userRoleFilter">

                        <option value="ALL">
                            Все роли
                        </option>

                        <option value="ROLE_ADMIN">
                            Администраторы
                        </option>

                        <option value="ROLE_COURIER">
                            Курьеры
                        </option>

                        <option value="ROLE_CUSTOMER">
                            Клиенты
                        </option>

                    </select>
                </div>

            </div>

            <div id="usersLoading" class="loading hidden">Загрузка пользователей...
            </div>

            <div class="table-wrapper">

                <table class="users-table">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Имя</th>
                        <th>Фамилия</th>
                        <th>Роль</th>
                        <th>Вид транспорта</th>
                        <th>Действия</th>
                    </tr>
                    </thead>

                    <tbody id="usersTableBody"></tbody>

                </table>

            </div>

            <div id="usersEmpty" class="empty-state hidden">Пользователи не найдены.
            </div>

        </div>

    </section>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
