<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery — Администратор</title>
    <link rel="stylesheet" href="../common/css/base.css">
    <link rel="stylesheet" href="../common/css/components.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-text">
                <span class="logo-title">Food Delivery</span>
                <span class="logo-subtitle">Панель администратора</span>
            </div>
        </div>

        <nav class="sidebar-nav">

            <button class="nav-item active" data-section="menu">
                <span class="nav-icon">🍕</span>
                <span>Меню</span>
            </button>

            <button class="nav-item" data-section="users">
                <span class="nav-icon">👥</span>
                <span>Пользователи</span>
            </button>

            <button class="nav-item" data-section="couriers">
                <span class="nav-icon">🚴</span>
                <span>Курьеры</span>
            </button>

            <button class="nav-item" type="button" data-section="profile">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="user-info">
                <div class="user-details">
                    <span class="user-name" id="userEmail"></span>
                </div>
            </div>

            <button class="logout-button" id="logoutButton">
                <span class="nav-icon">🚪</span>
                <span>Выйти</span>
            </button>

        </div>

    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h1 id="pageTitle">Меню</h1>
                <p id="pageDescription">Управление меню ресторана</p>
            </div>
        </header>

        <section class="content-section">
            <div id="content">
                <div class="empty-state">
                    <div class="empty-state-icon">🍕</div>
                    <h2>Управление меню</h2>
                    <p>Здесь будет управление блюдами меню.</p>
                </div>
            </div>
        </section>

    </main>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
